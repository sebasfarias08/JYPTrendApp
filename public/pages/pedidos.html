<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FA" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png?v=2">
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Historial Pedidos</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/tailwind.css" />
</head>

<body class="h-screen overflow-hidden flex flex-col">
  <header id="appShellTop"></header>

  <main class="flex-1 overflow-y-auto pb-[calc(env(safe-area-inset-bottom)+7rem)]">
    <div id="orders-container" class="max-w-6xl mx-auto p-4"></div>
  </main>

  <nav id="appShellBottom"></nav>

  <script type="module">
    import { requireAuth } from "/js/app/auth/auth.js";
    import { initAppShell } from "/js/app/shell/app-shell.js";

    const session = await requireAuth();
    if (!session) throw new Error("Redirect login");

    initAppShell({
      title: "Historial Pedidos",
      onRefresh: async () => location.reload()
    });

    // Load orders screen module only when needed to avoid blocking main-thread
    import('/js/features/orders/orders.js')
      .then((mod) => {
        mod.initOrdersScreen?.({ containerId: 'orders-container' });
      })
      .catch((err) => console.error('Failed to load orders module:', err));
  </script>
</body>
</html>
